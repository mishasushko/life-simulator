<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1ea">
  <title>Жизнь — симулятор</title>
  <meta name="description" content="Проживи целую жизнь: учёба, карьера, любовь, деньги и случайности. Каждое решение важно.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>try { const t = localStorage.getItem('lifesim_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Жизнь">
  <link rel="stylesheet" href="style.css?v=35">
</head>
<body>
  <!-- Стартовый экран -->
  <section id="start" class="screen active">
    <div class="start-wrap">
      <div class="hero">
        <div class="hero-badge">симулятор жизни</div>
        <h1>Проживи<br><span>свою жизнь</span></h1>
        <p>От первого шага до последнего вздоха. 132 страны, полтора века истории и тысячи решений, каждое из которых что-то меняет.</p>
        <div class="hero-orbs" aria-hidden="true">
          <span>👶</span><span>🎓</span><span>💼</span><span>💍</span><span>🏡</span><span>✈️</span><span>👵</span>
        </div>
      </div>
      <div class="start-card">
        <form id="startForm" class="start-form">
          <div class="form-title">Новая жизнь</div>
          <div class="two">
            <label>Имя
              <input id="inName" placeholder="Случайное" maxlength="20" autocomplete="off">
            </label>
            <label>Фамилия
              <input id="inSurname" placeholder="Случайная" maxlength="24" autocomplete="off">
            </label>
          </div>
          <div class="two">
            <label>Год рождения
              <input id="inYear" type="number" min="1900" max="2060" step="1" inputmode="numeric">
            </label>
            <label>Страна
              <select id="inCountry"></select>
            </label>
          </div>
          <div class="two">
            <label>Город
              <select id="inCity" disabled><option value="">🎲 Случайный город</option></select>
            </label>
            <label>День рождения
              <span class="date-pair"><select id="inDay" aria-label="День"></select><select id="inMonth" aria-label="Месяц"></select></span>
            </label>
          </div>
          <div class="two">
            <label>Пол
              <select id="inGender"></select>
            </label>
            <label>Ориентация
              <select id="inOrient"></select>
            </label>
          </div>
          <label>Религия
            <select id="inReligion"></select>
          </label>
          <div class="two">
            <label>Режим
              <select id="inMode"><option value="normal">🌱 Одна жизнь</option><option value="dynasty">👑 Династия</option></select>
            </label>
            <label>Вызов
              <select id="inChallenge"><option value="">Без вызова</option></select>
            </label>
          </div>
          <button class="btn primary big" type="submit">Родиться →</button>
          <button class="btn ghost" type="button" id="dailyBtn">🗓️ Ежедневный вызов</button>
          <button class="btn ghost" type="button" id="continueBtn" hidden>Продолжить сохранённую жизнь</button>
        </form>
      </div>
    </div>
    <button class="icon-btn theme-btn floating" data-theme-toggle aria-label="Сменить тему">🌙</button>
  </section>

  <!-- Игровой экран -->
  <section id="game" class="screen">
    <aside class="side">
      <header class="profile card-s">
        <div class="profile-top">
          <div class="avatar-ring"><div class="avatar" id="avatar">👶</div></div>
          <div class="who">
            <div class="name" id="pName">—</div>
            <div class="chips" id="pChips"></div>
          </div>
        </div>
        <div id="sceneCaption"></div><button type="button" class="btn ghost sm" id="memoryWall"></button>
        <div class="money-row">
          <div>
            <div class="label">Баланс</div>
            <div class="value" id="pMoney">0 ₽</div>
          </div>
          <div class="top-actions">
            <button class="icon-btn" id="mapBtn" title="Карта мира" aria-label="Карта мира">🌍</button>
            <button class="icon-btn" data-theme-toggle title="Тема" aria-label="Сменить тему">🌙</button>
            <button class="icon-btn" id="menuBtn" title="Меню" aria-label="Меню">☰</button>
          </div>
        </div>
      </header>

      <section class="stats card-s" aria-label="Характеристики">
        <div class="ring" data-k="happy"><div class="ring-c"><b></b></div><span>Счастье</span></div>
        <div class="ring" data-k="health"><div class="ring-c"><b></b></div><span>Здоровье</span></div>
        <div class="ring" data-k="smarts"><div class="ring-c"><b></b></div><span>Ум</span></div>
        <div class="ring" data-k="looks"><div class="ring-c"><b></b></div><span>Внешность</span></div>
      </section>

      <div id="statChanges"></div>
      <nav class="side-nav card-s">
        <button class="nav-btn" data-panel="job"><span class="ni" style="--c:#5b5bf7">💼</span><span>Учёба и работа</span></button>
        <button class="nav-btn" data-panel="assets"><span class="ni" style="--c:#16a34a">🏠</span><span>Имущество</span></button>
        <button class="nav-btn" data-panel="people"><span class="ni" style="--c:#e8467c">💞</span><span>Отношения</span></button>
        <button class="nav-btn" data-panel="activities"><span class="ni" style="--c:#f59e0b">🎯</span><span>Занятия</span></button>
      </nav>
    </aside>

    <main class="timeline-wrap">
      <div class="timeline" id="log" aria-live="polite"></div>
    </main>

    <nav class="dock">
      <div id="quickBar"></div>
      <button class="dock-btn" data-panel="job"><span>💼</span>Работа</button>
      <button class="dock-btn" data-panel="assets"><span>🏠</span>Деньги</button>
      <button class="age-btn" id="ageBtn" aria-label="Прожить год"><span class="plus">+1</span><span class="lbl">год</span></button>
      <button class="dock-btn" data-panel="people"><span>💞</span>Люди</button>
      <button class="dock-btn" data-panel="activities"><span>🎯</span>Занятия</button>
    </nav>
  </section>

  <!-- Панель (шторка) -->
  <div class="sheet-wrap" id="sheetWrap" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button class="icon-btn" id="sheetClose" aria-label="Закрыть">✕</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <!-- Событие (модалка) -->
  <div class="modal-wrap" id="modalWrap" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-emoji" id="modalEmoji"></div>
      <h3 id="modalTitle"></h3>
      <p id="modalText"></p>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="data.js?v=20"></script>
  <script src="news.js?v=20"></script>
  <script src="game.js?v=35"></script>
  <script src="extras.js?v=27"></script>
  <script src="features.js?v=35"></script>
  <script src="story.js?v=35"></script>
  <script src="avatar.js?v=20"></script>
  <script src="history.js?v=35"></script>
  <script src="countries.js?v=21"></script>
  <script src="names.js?v=35"></script>
  <script src="careers.js?v=35"></script>
  <script src="modes.js?v=35"></script>
  <script src="meta.js?v=20"></script>
  <script src="fun.js?v=35"></script>
  <script src="life.js?v=35"></script>
  <script src="careers2.js?v=20"></script>
  <script src="deep.js?v=35"></script>
  <script src="progression.js?v=35"></script>
  <script src="relationships.js?v=33"></script>
  <script src="narrative.js?v=31"></script>
  <script src="visuals.js?v=30"></script>
  <script src="online-config.js?v=26"></script>
  <script src="online.js?v=25"></script>
  <script src="expansion.js?v=34"></script>
  <script src="keepsakes.js?v=31"></script>
  <script src="intimacy.js?v=32"></script>
  <script src="era.js?v=35"></script>
  <script src="i18n.js?v=35"></script>
</body>
</html>
