name: Game checks
on:
  push:
  pull_request:
jobs:
  progression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - name: Check JavaScript syntax
        run: for file in *.js; do node --check "$file"; done
